name: sync-bundle
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          RUN=$(gh run list -R revenge-mod/revenge-bundle-next -w build.yml -b main -s success -L 1 --json databaseId -q '.[0].databaseId')
          gh run download $RUN -R revenge-mod/revenge-bundle-next -D out
          f=$(find out -name revenge.bundle | head -1)
          gh release delete latest -y --cleanup-tag -R ${{ github.repository }} || true
          gh release create latest "$f" -R ${{ github.repository }} -t latest -n "run $RUN"
